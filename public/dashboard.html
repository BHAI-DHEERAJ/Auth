<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Auth System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100vh;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #27272a;
      background: #18181b;
    }
    nav h2 { font-size: 1.2rem; }
    nav .btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      background: transparent;
      color: #e4e4e7;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    nav .btn:hover { background: #27272a; }
    .container { max-width: 700px; margin: 3rem auto; padding: 0 1.5rem; }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 2rem;
    }
    .card h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .info { display: grid; gap: 1rem; }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #27272a;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #a1a1aa; }
    .value { font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #22c55e20;
      color: #4ade80;
      border: 1px solid #22c55e40;
    }
    .loading { text-align: center; color: #a1a1aa; padding: 3rem; }
  </style>
</head>
<body>
  <nav>
    <h2>Auth System</h2>
    <button class="btn" id="logoutBtn">Sign Out</button>
  </nav>
  <div class="container">
    <div class="card">
      <h1>Dashboard</h1>
      <div id="content" class="loading">Loading...</div>
      <div class="info" id="info" style="display:none">
        <div class="row"><span class="label">ID</span><span class="value" id="uid"></span></div>
        <div class="row"><span class="label">Username</span><span class="value" id="uname"></span></div>
        <div class="row"><span class="label">Email</span><span class="value" id="uemail"></span></div>
        <div class="row"><span class="label">Joined</span><span class="value" id="ucreated"></span></div>
        <div class="row"><span class="label">Status</span><span class="badge">Active</span></div>
      </div>
    </div>
  </div>
  <script>
    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) {
        window.location.href = '/login.html';
        return;
      }
      const data = await res.json();
      document.getElementById('uid').textContent = data.user.id;
      document.getElementById('uname').textContent = data.user.username;
      document.getElementById('uemail').textContent = data.user.email;
      document.getElementById('ucreated').textContent = new Date(data.user.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      document.getElementById('content').style.display = 'none';
      document.getElementById('info').style.display = 'grid';
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
